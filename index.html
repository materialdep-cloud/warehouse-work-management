
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倉庫智慧派工管理系統</title>
<style>
:root {
  --bg:#f4f6fa; --card:#fff; --text:#202938;
  --muted:#8490a1; --primary:#315bea; --line:#e8edf3;
}
* {box-sizing:border-box}
body {
  margin:0; font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text);
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
.app {display:flex;min-height:100vh}
.sidebar {
  width:230px;background:#17243a;color:white;
  padding:25px 16px;flex-shrink:0;
}
.brand {font-size:19px;font-weight:bold;margin:5px 8px 35px}
.brand small {display:block;font-size:11px;color:#aebbd0;margin-top:7px;font-weight:normal}
.nav-btn {
  width:100%;border:0;background:transparent;color:#bdc8d8;
  text-align:left;padding:13px 15px;border-radius:9px;
  margin-bottom:7px;font-size:14px;
}
.nav-btn.active,.nav-btn:hover {background:#2c4163;color:white}
.sidebar-foot {margin-top:40px;color:#94a4bb;font-size:12px;padding:10px}
.main {flex:1;min-width:0;padding:28px 32px}
.topbar {display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}
h1 {font-size:25px;margin:0 0 7px}
.subtitle {color:var(--muted);font-size:13px}
.primary {
  background:var(--primary);color:white;border:0;border-radius:9px;
  padding:11px 17px;font-weight:bold;
}
.primary:hover {background:#2449c8}
.secondary {
  background:white;border:1px solid var(--line);border-radius:8px;
  padding:9px 13px;color:var(--text);
}
.stats {display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat {
  background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:19px;
}
.stat-label {font-size:13px;color:var(--muted)}
.stat-number {font-size:29px;font-weight:bold;margin:12px 0 4px}
.stat-note {font-size:11px;color:var(--muted)}
.panel {
  background:white;border:1px solid var(--line);
  border-radius:13px;padding:20px;margin-bottom:20px;
}
.panel-head {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.panel-head h2 {font-size:17px;margin:0}
.task-row {
  display:grid;grid-template-columns:1.2fr 1fr 1fr auto;
  align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);
}
.task-name {font-weight:bold;font-size:14px}
.task-sub {font-size:12px;color:var(--muted);margin-top:5px}
.status {
  display:inline-block;border-radius:20px;padding:5px 10px;
  font-size:11px;white-space:nowrap;
}
.s-pending {background:#fff2d9;color:#a36a00}
.s-confirm {background:#fce8e8;color:#c43c3c}
.s-progress {background:#e7efff;color:#315bea}
.s-done {background:#e1f5e9;color:#21834c}
.s-cancel {background:#eceef1;color:#727b88}
.toolbar {display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}
.toolbar input,.toolbar select {
  border:1px solid var(--line);background:white;border-radius:8px;
  padding:10px;min-width:150px;
}
.calendar-head {display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.calendar-title {font-size:18px;font-weight:bold}
.calendar-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.weekday {text-align:center;color:var(--muted);font-size:12px;padding:10px 0}
.day {
  background:#fff;border:1px solid var(--line);border-radius:8px;
  min-height:105px;padding:8px;cursor:pointer;overflow:hidden;
}
.day:hover,.day.selected {border:2px solid var(--primary);padding:7px}
.day.other {background:#f8f9fb;color:#b7bfca}
.day.today {background:#eef3ff}
.day-num {font-size:13px;font-weight:bold}
.day-task {
  margin-top:6px;border-radius:4px;padding:4px;
  font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:#e7efff;color:#315bea;
}
.day-task.done {background:#e1f5e9;color:#21834c}
.day-task.confirm {background:#fce8e8;color:#c43c3c}
.day-task.pending {background:#fff2d9;color:#a36a00}
.empty {padding:25px;text-align:center;color:var(--muted);font-size:13px}
.page {display:none}
.page.active {display:block}
.modal-bg {
  display:none;position:fixed;inset:0;background:#17243a88;
  z-index:10;align-items:center;justify-content:center;padding:15px;
}
.modal-bg.show {display:flex}
.modal {
  width:100%;max-width:510px;max-height:90vh;overflow:auto;
  background:white;border-radius:15px;padding:23px;
}
.modal h2 {margin:0 0 18px;font-size:19px}
.form-grid {display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field {display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field.full {grid-column:1/-1}
.field label {font-size:12px;color:#667085}
.field input,.field select,.field textarea {
  border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;
}
.field textarea {min-height:65px;resize:vertical}
.modal-actions {display:flex;justify-content:flex-end;gap:9px;margin-top:15px}
.action-btn {border:0;background:transparent;color:var(--primary);font-size:12px}
.footer-note {color:var(--muted);font-size:11px;text-align:center;padding:15px}
@media(max-width:850px) {
  .sidebar {width:65px;padding:20px 7px}
  .brand {font-size:0;margin:5px 0 30px;text-align:center}
  .brand:before {content:"倉";font-size:21px}
  .brand small,.nav-text,.sidebar-foot {display:none}
  .nav-btn {text-align:center;padding:13px 3px;font-size:18px}
  .main {padding:20px 15px}
  .stats {grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px) {
  .topbar {align-items:flex-start;flex-direction:column}
  .task-row {grid-template-columns:1fr auto}
  .task-row .task-extra {grid-column:1/-1}
  .day {min-height:75px;padding:5px}
  .day-task {font-size:9px;padding:3px}
  .calendar-grid {gap:3px}
  .form-grid {grid-template-columns:1fr}
  .field.full {grid-column:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">倉庫智慧派工<small>WAREHOUSE MANAGEMENT</small></div>
    <button class="nav-btn active" data-page="dashboard">📊 <span class="nav-text">工作儀表板</span></button>
    <button class="nav-btn" data-page="calendar">📅 <span class="nav-text">工作月曆</span></button>
    <button class="nav-btn" data-page="tasks">📋 <span class="nav-text">工作管理</span></button>
    <div class="sidebar-foot">版本 V1.0<br>資料儲存於本機瀏覽器</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">工作儀表板</h1>
        <div class="subtitle" id="todayText"></div>
      </div>
      <button class="primary" onclick="openModal()">＋ 新增派工</button>
    </div>

    <section class="page active" id="dashboard">
      <div class="stats">
        <div class="stat"><div class="stat-label">今日工作</div><div class="stat-number" id="todayCount">0</div><div class="stat-note">今日預定工作</div></div>
        <div class="stat"><div class="stat-label">待確認</div><div class="stat-number" id="confirmCount">0</div><div class="stat-note">需要人工確認</div></div>
        <div class="stat"><div class="stat-label">進行中／待處理</div><div class="stat-number" id="activeCount">0</div><div class="stat-note">尚未完成工作</div></div>
        <div class="stat"><div class="stat-label">已完成</div><div class="stat-number" id="doneCount">0</div><div class="stat-note">今日完成工作</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>📌 今日派工</h2><button class="action-btn" onclick="showPage('tasks')">查看全部 →</button></div>
        <div id="todayTasks"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>⏰ 近期工作</h2></div>
        <div id="upcomingTasks"></div>
      </div>
    </section>

    <section class="page" id="calendar">
      <div class="panel">
        <div class="calendar-head">
          <button class="secondary" onclick="changeMonth(-1)">← 上個月</button>
          <div class="calendar-title" id="monthTitle"></div>
          <button class="secondary" onclick="changeMonth(1)">下個月 →</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 id="selectedDateTitle">當日工作</h2><button class="primary" onclick="openModal(selectedDate)">＋ 新增</button></div>
        <div id="selectedDateTasks"></div>
      </div>
    </section>

    <section class="page" id="tasks">
      <div class="panel">
        <div class="panel-head"><h2>全部工作清單</h2></div>
        <div class="toolbar">
          <input id="searchInput" placeholder="搜尋品項、人員、路線..." oninput="renderTasks()">
          <select id="statusFilter" onchange="renderTasks()">
            <option value="">全部狀態</option>
            <option>待確認</option><option>待處理</option>
            <option>進行中</option><option>已完成</option><option>已取消</option>
          </select>
          <input id="dateFilter" type="date" onchange="renderTasks()">
        </div>
        <div id="allTasks"></div>
      </div>
    </section>
    <div class="footer-note">倉庫智慧派工管理系統 · V1.0 · 示範資料僅供測試</div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">新增派工</h2>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <div class="form-grid">
        <div class="field">
          <label>工作日期 *</label>
          <input type="date" id="taskDate" required>
        </div>
        <div class="field">
          <label>負責人</label>
          <input id="person" placeholder="例如：阿豪、祥智">
        </div>
        <div class="field">
          <label>品項 *</label>
          <input id="product" placeholder="例如：杏鮑菇B" required>
        </div>
        <div class="field">
          <label>重量（kg）</label>
          <input type="number" id="weight" min="0" step="0.1" placeholder="180">
        </div>
        <div class="field">
          <label>件數</label>
          <input type="number" id="quantity" min="0" placeholder="10">
        </div>
        <div class="field">
          <label>工作狀態</label>
          <select id="taskStatus">
            <option>待確認</option><option>待處理</option>
            <option>進行中</option><option>已完成</option><option>已取消</option>
          </select>
        </div>
        <div class="field full">
          <label>轉貨路線／地點</label>
          <input id="route" placeholder="例如：大發 → 正裕 → 永豐">
        </div>
        <div class="field full">
          <label>工作備註</label>
          <textarea id="note" placeholder="其他工作內容、注意事項..."></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">儲存工作</button>
      </div>
    </form>
  </div>
</div>

<script>
const today = new Date();
const dateKey = d => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
};
const offsetDate = n => {
  const d = new Date(); d.setDate(d.getDate()+n); return dateKey(d);
};
const escapeHTML = s => String(s ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let tasks = [];
try { tasks = JSON.parse(localStorage.getItem("warehouseTasks") || "[]"); }
catch(e) { tasks=[]; }

if (!tasks.length) {
  tasks = [
    {id:"demo1",date:offsetDate(0),person:"阿豪、祥智",product:"杏鮑菇B",weight:180,quantity:10,route:"大發 → 正裕 → 永豐",status:"待處理",note:"早上安排轉二場"},
    {id:"demo2",date:offsetDate(0),person:"阿明",product:"秀珍菇",weight:80,quantity:5,route:"一場 → 二場",status:"進行中",note:""},
    {id:"demo3",date:offsetDate(1),person:"小林",product:"金針菇",weight:120,quantity:8,route:"冷藏庫 → 出貨區",status:"待確認",note:"等待確認數量"},
    {id:"demo4",date:offsetDate(2),person:"阿豪",product:"杏鮑菇A",weight:200,quantity:12,route:"二場 → 包裝區",status:"已完成",note:""}
  ];
  save();
}
function save() { localStorage.setItem("warehouseTasks",JSON.stringify(tasks)); }
function formatDate(s) {
  if (!s) return "";
  const [y,m,d]=s.split("-");
  return `${y}/${m}/${d}`;
}
function statusClass(s) {
  return {"待確認":"s-confirm","待處理":"s-pending","進行中":"s-progress","已完成":"s-done","已取消":"s-cancel"}[s] || "s-pending";
}
function statusTag(s) { return `<span class="status ${statusClass(s)}">${escapeHTML(s)}</span>`; }
function taskHTML(t) {
  return `<div class="task-row">
    <div><div class="task-name">${escapeHTML(t.product)}</div>
      <div class="task-sub">${formatDate(t.date)} · ${escapeHTML(t.person||"未指定人員")}</div></div>
    <div class="task-extra">${escapeHTML(t.weight||0)} kg / ${escapeHTML(t.quantity||0)} 件</div>
    <div class="task-extra">${statusTag(t.status)}</div>
    <div><button class="action-btn" onclick="editTask('${t.id}')">編輯</button></div>
  </div>`;
}
function renderDashboard() {
  const todayTasks=tasks.filter(t=>t.date===dateKey(today)&&t.status!=="已取消");
  document.getElementById("todayCount").textContent=todayTasks.length;
  document.getElementById("confirmCount").textContent=todayTasks.filter(t=>t.status==="待確認").length;
  document.getElementById("activeCount").textContent=todayTasks.filter(t=>["待處理","進行中"].includes(t.status)).length;
  document.getElementById("doneCount").textContent=todayTasks.filter(t=>t.status==="已完成").length;
  document.getElementById("todayTasks").innerHTML=todayTasks.length?todayTasks.map(taskHTML).join(""):'<div class="empty">今天沒有派工</div>';
  const upcoming=tasks.filter(t=>t.date>dateKey(today)&&t.status!=="已取消").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  document.getElementById("upcomingTasks").innerHTML=upcoming.length?upcoming.map(taskHTML).join(""):'<div class="empty">目前沒有未來工作</div>';
}
function renderTasks() {
  const q=document.getElementById("searchInput").value.toLowerCase();
  const st=document.getElementById("statusFilter").value;
  const dt=document.getElementById("dateFilter").value;
  const list=tasks.filter(t=>
    (!q||[t.product,t.person,t.route,t.note].join(" ").toLowerCase().includes(q)) &&
    (!st||t.status===st) && (!dt||t.date===dt)
  ).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById("allTasks").innerHTML=list.length?list.map(taskHTML).join(""):'<div class="empty">沒有符合條件的工作</div>';
}
let monthView=new Date(today.getFullYear(),today.getMonth(),1);
let selectedDate=dateKey(today);
function changeMonth(n) {
  monthView.setMonth(monthView.getMonth()+n); renderCalendar();
}
function renderCalendar() {
  const y=monthView.getFullYear(),m=monthView.getMonth();
  document.getElementById("monthTitle").textContent=`${y} 年 ${m+1} 月`;
  const grid=document.getElementById("calendarGrid");
  const days=["日","一","二","三","四","五","六"];
  let html=days.map(d=>`<div class="weekday">${d}</div>`).join("");
  const first=new Date(y,m,1).getDay();
  const total=new Date(y,m+1,0).getDate();
  const prevTotal=new Date(y,m,0).getDate();
  for(let i=0;i<42;i++){
    let d,other=false;
    if(i<first){d=new Date(y,m-1,prevTotal-first+i+1);other=true;}
    else if(i>=first+total){d=new Date(y,m+1,i-first-total+1);other=true;}
    else d=new Date(y,m,i-first+1);
    const key=dateKey(d);
    const list=tasks.filter(t=>t.date===key&&t.status!=="已取消");
    html+=`<div class="day ${other?"other":""} ${key===dateKey(today)?"today":""} ${key===selectedDate?"selected":""}" onclick="selectDay('${key}')">
      <div class="day-num">${d.getDate()}</div>
      ${list.slice(0,2).map(t=>`<div class="day-task ${t.status==="已完成"?"done":t.status==="待確認"?"confirm":t.status==="待處理"?"pending":""}">${escapeHTML(t.product)}</div>`).join("")}
      ${list.length>2?`<div class="task-sub">另有 ${list.length-2} 筆</div>`:""}
    </div>`;
  }
  grid.innerHTML=html;
  renderSelectedDay();
}
function selectDay(key) { selectedDate=key; renderCalendar(); }
function renderSelectedDay() {
  document.getElementById("selectedDateTitle").textContent=`${formatDate(selectedDate)} 工作`;
  const list=tasks.filter(t=>t.date===selectedDate&&t.status!=="已取消");
  document.getElementById("selectedDateTasks").innerHTML=list.length?list.map(taskHTML).join(""):'<div class="empty">這一天沒有派工</div>';
}
function showPage(name) {
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(name).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===name));
  document.getElementById("pageTitle").textContent={dashboard:"工作儀表板",calendar:"工作月曆",tasks:"工作管理"}[name];
  if(name==="calendar")renderCalendar();
  if(name==="tasks")renderTasks();
}
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));

function openModal(date=dateKey(today),task=null) {
  document.getElementById("taskForm").reset();
  document.getElementById("taskId").value=task?.id||"";
  document.getElementById("taskDate").value=task?.date||date;
  document.getElementById("person").value=task?.person||"";
  document.getElementById("product").value=task?.product||"";
  document.getElementById("weight").value=task?.weight||"";
  document.getElementById("quantity").value=task?.quantity||"";
  document.getElementById("route").value=task?.route||"";
  document.getElementById("note").value=task?.note||"";
  document.getElementById("taskStatus").value=task?.status||"待確認";
  document.getElementById("modalTitle").textContent=task?"修改派工":"新增派工";
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show");}
function editTask(id) {
  const task=tasks.find(t=>t.id===id);
  if(task)openModal(task.date,task);
}
document.getElementById("taskForm").addEventListener("submit",e=>{
  e.preventDefault();
  const id=document.getElementById("taskId").value;
  const item={
    id:id||("task_"+Date.now()),
    date:document.getElementById("taskDate").value,
    person:document.getElementById("person").value.trim(),
    product:document.getElementById("product").value.trim(),
    weight:Number(document.getElementById("weight").value)||0,
    quantity:Number(document.getElementById("quantity").value)||0,
    route:document.getElementById("route").value.trim(),
    note:document.getElementById("note").value.trim(),
    status:document.getElementById("taskStatus").value
  };
  if(id)tasks=tasks.map(t=>t.id===id?item:t);
  else tasks.push(item);
  save(); closeModal(); refresh();
});
function refresh() {
  renderDashboard(); renderTasks(); renderCalendar();
}
document.getElementById("modalBg").addEventListener("click",e=>{
  if(e.target.id==="modalBg")closeModal();
});
document.getElementById("todayText").textContent=
  today.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
refresh();
</script>
</body>
</html>
